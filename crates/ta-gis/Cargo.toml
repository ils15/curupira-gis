[package]
name = "ta-gis"
description = "IO geoespacial do terraamazon-cleanroom-rust: leitura/escrita vetorial e raster, normalização e derivados."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ta-core.workspace = true
thiserror.workspace = true
serde_json.workspace = true
geo-types.workspace = true

# Depespesas ficam atrás de features — o build default continua enxuto.
gdal = { workspace = true, optional = true }
geojson = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
geozero = { workspace = true, optional = true }
flatgeobuf = { workspace = true, optional = true }
ta-db = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

[features]
default = []
gdal = ["dep:gdal"]
# Bindings do gdal-sys gerados NO build (bindgen + libclang) em vez dos
# pré-gerados. Necessário quando o GDAL do sistema excede 3.12 — última
# versão com binding pré-gerado no gdal-sys 0.12 (prebuilt-bindings/3_4..3_12;
# run #3 da release: brew GDAL 3.13 → panic "No pre-built bindings"). O crate
# gdal 0.19 reexporta a feature p/ o gdal-sys: `gdal/bindgen` →
# `gdal-sys/bindgen` (verificado em gdal-0.19.0/Cargo.toml, seção [features]);
# habilitar `dep_name/feature` ativa o dep opcional implicitamente (cargo).
# Libclang em runtime: clang-sys (build-dep opcional `bindgen` do gdal-sys).
bindgen-gdal = ["gdal/bindgen"]
geojson = ["dep:geojson"]
csv = ["dep:csv"]
# geozero é usado junto do flatgeobuf (escrita FGB via processadores geozero);
# sozinho não expõe módulo público novo.
geozero = ["dep:geozero"]
flatgeobuf = ["dep:flatgeobuf", "dep:geozero"]
# Export de features do banco (FeatureRepo) — consome ta-db.
db = ["dep:ta-db"]
# Cliente WMS 1.3.0 com cache em disco (reqwest async + TTL).
wms = ["dep:reqwest", "dep:sha2", "dep:percent-encoding"]
