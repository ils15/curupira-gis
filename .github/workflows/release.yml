name: release

# Release Curupira GIS — disparada por tag `v*` (convenção: tag == versão do
# workspace, ex.: v0.1.0 == Cargo.toml [workspace.package] version).
#
# FLUXO (4 passos, gate humano no final):
#   1. devs fazem commits conventional no `main`;
#   2. o release-please abre/atualiza o "Release PR" (bump de
#      [workspace.package] version + CHANGELOG.md);
#   3. o Release PR é mergeado -> o release-please cria a tag `vX.Y.Z` ->
#      este workflow roda, ESPERA O CI VERDE e monta a release DRAFT com os
#      assets;
#   4. um humano clica "Publish".
#
# GATE DE VERSÃO (2026-10-19, @prometheus): a tag precisa bater com
# [workspace.package] version do Cargo.toml; o job `verify-version` roda
# ANTES de qualquer build e falha com mensagem explícita se divergir. Sem
# ele, o instalador Windows (versão vinda da TAG) e o .deb (versão vinda do
# Cargo.toml) podiam sair com versões diferentes — sem erro em nenhum job.
# Desde 2026-10-19 a versão tem UMA fonte: o Release PR do release-please
# bumpa o manifesto e o Cargo.toml no mesmo PR, e a tag é derivada do
# manifesto (scripts/create-release-tag.sh) — a divergência tag↔versão
# deixou de ser possível por construção.
#
# DECISÃO DE PACKAGING (2026-10-16, documentada no README "Releases"):
# workflow MANUAL com matrix build em vez de cargo-dist. Motivos: (a) o CI do
# cargo-dist é gerado por `dist init`, que não pode ser produzido nem
# validado no host de desenvolvimento; (b) matrix de 2 alvos não justifica a
# maquinaria de 20 alvos; (c) este workflow é 100% auditável e pinado por
# SHA. Reavaliar cargo-dist pós-alpha.
#
# GATE HUMANO MANTIDO: a release é sempre criada como **draft**; publicar
# exige um humano marcando "Publish" na página da release.
#
# 2026-10-17 (entregáveis pedidos pelo usuário, @prometheus): além do zip
# Windows + tar.gz Linux + SBOMs existentes, o draft passa a incluir
# instalador Windows (Inno Setup/ISCC), .deb (cargo-deb) e macOS arm64
# (CurupiraGIS.app zip via packaging/macos/bundle.sh). Jobs existentes
# intactos — apenas steps adicionados ao final.
#
# 2026-10-19 (@prometheus, modernização do CI/CD):
#   * `workflow_dispatch` com input `tag` — re-rodar o build de uma tag já
#     existente sem novo push de tag (o input `tag` é OBRIGATÓRIO: vazio
#     significaria "a ref do disparo" = a branch, e o build sairia do código
#     errado);
#   * `workflow_call` — o release-please chama este workflow explicitamente
#     (tags criadas via API com GITHUB_TOKEN não disparam `on: push: tags`);
#   * job `wait-for-ci` — a release só é montada se o CI do MESMO SHA da tag
#     estiver verde (espera até 15 min, poll de 30 s);
#   * `concurrency` — releases da mesma tag não rodam em paralelo.
#
# REGRA DE REF (B-1, 2026-10-19): todo checkout de BUILD usa
# `ref: ${{ inputs.tag || github.ref }}` e uma GUARDA que compara o SHA do
# workspace com o SHA resolvido pela tag (output do job `wait-for-ci`),
# falhando se divergirem. Sem isso, no caminho `workflow_call` o default do
# checkout é `github.ref` do CALLER (= `refs/heads/main`) e os assets da
# release viriam do código de `main` rotulados com a tag — sem erro em
# nenhum job. A regra vale para os 3 gatilhos (`push: tags`,
# `workflow_call`, `workflow_dispatch`).
#
# RE-RUN DE RELEASE PUBLICADA (M-1, 2026-10-19): se a release da tag já
# existe e NÃO é draft, o job `release` FALHA (o `--clobber` publicaria
# binário por cima de uma release já distribuída). Atualizar um DRAFT
# continua permitido.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a reconstruir (ex.: v0.3.0-alpha.1). OBRIGATÓRIO: sem tag, o disparo usaria a ref do workflow (a branch) e o build sairia do código errado."
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag a construir (ex.: v0.3.0-alpha)."
        required: true
        type: string

# REGRA DE REF (B-1, 2026-10-19, @prometheus): TODO checkout de BUILD usa
# `ref: ${{ inputs.tag || github.ref }}` — o código compilado é SEMPRE o da
# tag, nos 3 gatilhos:
#   * `push: tags`      -> github.ref == refs/tags/vX.Y.Z (a própria tag);
#   * `workflow_call`   -> inputs.tag (a tag pedida pelo caller);
#   * `workflow_dispatch` -> inputs.tag (obrigatório).
# Sem isso, no `workflow_call` o default do checkout é `github.ref` do
# CALLER (= refs/heads/main) e a release sairia com o binário de `main`
# rotulado como a tag. Além do `ref:`, cada job de build tem uma GUARDA que
# compara o SHA do workspace com o SHA resolvido pela tag e FALHA na
# divergência (ver o step "Confere que o build é do commit da tag").
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Tag alvo. No disparo por `push: tags` = a própria tag; no
  # `workflow_dispatch` = o input; no `workflow_call` = o input do caller.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Releases da MESMA tag não rodam em paralelo (o `cancel-in-progress: false`
# deixa o run anterior terminar — cancelar uma release em andamento deixaria
# assets pela metade).
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Actions pinadas por SHA de commit (review F0-N):
#   actions/checkout@v6.1.0
#   actions-rust-lang/setup-rust-toolchain@v1.17.0
#   actions/cache@v6.1.0
#   actions/upload-artifact@v4.6.1
#   actions/download-artifact@v4.3.0
#   mamba-org/setup-micromamba@v1 (objeto da tag v1 em 2026-10-17; job macOS)

jobs:
  # GATE DE VERSÃO: a tag precisa bater com [workspace.package] version do
  # Cargo.toml. Único job sem toolchain Rust (grep/sed/awk puros) — o gate
  # não pode depender de `cargo metadata`.
  verify-version:
    name: Verifica tag == versão do workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GUARDA DO B-1: o código verificado tem que ser o da TAG. O checkout
      # acima usa a tag; aqui comparamos o SHA do workspace com o SHA que a
      # tag aponta (resolvido pela API) e falhamos se divergirem. Sem esta
      # guarda, um `workflow_call` (ou um `workflow_dispatch` de tag antiga)
      # publicaria o binário de `main` rotulado como a tag, sem erro.
      - name: Confere que o build é do commit da tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            echo "::error::não consegui resolver o SHA da tag ${tag} — a tag existe no repositório?"
            exit 1
          fi
          ws="$(git rev-parse 'HEAD^{commit}')"
          if [ "$ws" != "$sha" ]; then
            echo "::error::build a partir de ${ws} mas a tag aponta para ${sha}"
            exit 1
          fi
          echo "OK: workspace (${ws}) == tag ${tag} (${sha})"

      - name: Compara tag com [workspace.package] version do Cargo.toml
        shell: bash
        run: |
          set -euo pipefail

          manifest="Cargo.toml"
          tag="${RELEASE_TAG}"

          if [ -z "$tag" ]; then
            echo "::error::nenhuma tag informada — no workflow_dispatch, preencha o input 'tag' (ex.: v0.3.0-alpha.1); o disparo por push de tag já traz a tag."
            exit 1
          fi

          # Versão do workspace: extrai APENAS a chave `version` da seção
          # [workspace.package] do Cargo.toml da raiz (o awk percorre as
          # seções; `version` de [package]/[dependencies] é ignorado).
          manifest_version="$(
            awk '
              /^[[:space:]]*\[/ {
                sec = $0
                sub(/[[:space:]]*#.*$/, "", sec)
                sub(/^[[:space:]]*\[/, "", sec)
                sub(/\][[:space:]]*$/, "", sec)
                gsub(/[[:space:]]/, "", sec)
                next
              }
              sec == "workspace.package" && $0 ~ /^[[:space:]]*version[[:space:]]*=/ {
                v = $0
                sub(/^[^=]*=[[:space:]]*/, "", v)
                sub(/[[:space:]]*#.*$/, "", v)
                gsub(/[^0-9A-Za-z.+-]/, "", v)
                print v
                exit
              }
            ' "$manifest" || true
          )"

          if [ -z "$manifest_version" ]; then
            echo "::error::não consegui extrair [workspace.package] version de $manifest — a chave 'version' existe nessa seção?"
            exit 1
          fi

          case "$tag" in
            v*) tag_version="${tag#v}" ;;
            *)
              echo "::error::tag inesperado: '$tag' (esperado 'v<versão>', ex.: v0.1.0)"
              exit 1
              ;;
          esac

          # Núcleo numérico da tag (0.1.0 de 0.1.0-rc.1) + sufixo restante.
          tag_core="${tag_version%%[-+]*}"
          tag_suffix="${tag_version#"$tag_core"}"
          suffix_body="${tag_suffix#-}"

          echo "tag: $tag | versão do workspace ([workspace.package] version): $manifest_version"

          if [ "$tag_version" = "$manifest_version" ]; then
            echo "OK: a tag $tag bate exatamente com a versão do workspace $manifest_version"
          elif [ "$tag_core" = "$manifest_version" ] && [ -n "$suffix_body" ] && [ "$suffix_body" != "$tag_suffix" ]; then
            # Sufixo '-<algo>' não vazio => pré-release da versão atual
            # (v0.1.0-rc.1 para a versão 0.1.0). Aceito: instalador e .deb
            # já reportam 0.1.0 (o .deb vem do Cargo.toml).
            echo "OK: a tag $tag é pré-release ($tag_suffix) da versão do workspace $manifest_version"
          else
            echo "::error::tag $tag ≠ versão do workspace $manifest_version — a versão agora é bumpada pelo Release PR do release-please (mergeado no main, o manifesto .release-please-manifest.json e o Cargo.toml são atualizados no mesmo PR). Não ajuste o Cargo.toml à mão: corrija o Release PR (ou, em release pontual sem bump, veja README §Release)."
            exit 1
          fi

  # ── GATE DE CI VERDE ──────────────────────────────────────────────────────
  # A release só é montada se o CI do MESMO SHA da tag estiver verde.
  # Sem este gate, uma tag empurrada sobre um commit com CI vermelho gerava
  # uma draft com assets possivelmente quebrados. O job espera (poll de 30 s)
  # até 15 min pelo run do CI e FALHA (job inteiro) se o CI não passar.
  wait-for-ci:
    name: Aguarda CI verde no commit da tag
    needs: [verify-version]
    runs-on: ubuntu-latest
    # O SHA resolvido da tag é exportado para os jobs de build: eles
    # comparam o SHA do workspace (após o checkout) com este valor e falham
    # se divergirem (guarda do B-1).
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    permissions:
      actions: read
      contents: read
    steps:
      # Checkout da branch padrão (e NÃO da tag): este job só precisa do
      # script de espera — o SHA da tag é resolvido pela API. Assim o gate
      # funciona também no re-run de tags antigas (criadas antes do script
      # existir). Os jobs de BUILD continuam na commit da tag (ref: a tag).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve o SHA da tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # /commits/{ref} aceita uma tag e devolve o commit "peeled"
          # (funciona para tag leve e anotada).
          if ! sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha 2>&1)"; then
            echo "::error::não consegui resolver o SHA da tag ${RELEASE_TAG}: ${sha}"
            exit 1
          fi
          if [ -z "$sha" ]; then
            echo "::error::não consegui resolver o SHA da tag ${RELEASE_TAG}"
            exit 1
          fi
          echo "tag ${RELEASE_TAG} -> ${sha}"
          echo "sha=${sha}" >>"$GITHUB_OUTPUT"

      - name: Aguarda o CI verde (poll 30s, limite 15min)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Limites sobrescritíveis p/ teste local (scripts/wait-for-ci.sh).
          CI_TIMEOUT_SECONDS: ${{ vars.CI_RELEASE_TIMEOUT_SECONDS || '900' }}
          CI_POLL_SECONDS: ${{ vars.CI_RELEASE_POLL_SECONDS || '30' }}
        run: bash scripts/wait-for-ci.sh "${{ steps.resolve.outputs.sha }}" ci.yml

  build-linux:
    name: linux x86_64-gnu (tar.gz)
    needs: [verify-version, wait-for-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GUARDA DO B-1: o build tem que sair do commit da TAG — o mesmo SHA
      # que o job `wait-for-ci` validou como CI verde. Se divergir, FALHA
      # (sem publicar nada).
      - name: Confere que o build é do commit da tag
        env:
          EXPECTED_SHA: ${{ needs.wait-for-ci.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::build a partir de ${actual} mas a tag aponta para ${EXPECTED_SHA}"
            exit 1
          fi
          echo "OK: build a partir de ${actual} (tag ${RELEASE_TAG})"

      - name: Instala toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: GDAL (link dinâmico)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev

      - name: Build release
        run: cargo build --release --workspace

      - name: Empacota tar.gz (curupira-gis + ta-cli)
        run: |
          mkdir -p dist/curupira-gis-"${RELEASE_TAG}"-x86_64-unknown-linux-gnu
          cp target/release/curupira-gis target/release/ta-cli \
            dist/curupira-gis-"${RELEASE_TAG}"-x86_64-unknown-linux-gnu/
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE.md \
            dist/curupira-gis-"${RELEASE_TAG}"-x86_64-unknown-linux-gnu/
          tar czf \
            "dist/curupira-gis-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            -C dist "curupira-gis-${RELEASE_TAG}-x86_64-unknown-linux-gnu"

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-linux
          path: dist/*.tar.gz
          if-no-files-found: error

      # --- .deb (novo; tar.gz acima permanece) -----------------------------
      # cargo-deb via cargo install (NÃO apt): o apt do ubuntu-24.04 traz
      # cargo-deb 1.42 (2021) com comportamento divergente do validado neste
      # projeto (cargo-deb 3.x — `cargo deb --no-build` e depends=$auto
      # verificados localmente em 2026-10-17). Cache do binário evita
      # recompilar a cada release.
      - name: Cache cargo-deb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deb
          key: cargo-deb-${{ runner.os }}-3.x-v1

      - name: Instala cargo-deb
        run: command -v cargo-deb >/dev/null 2>&1 || cargo install cargo-deb --locked

      - name: Empacota .deb (curupira-gis + ta-cli)
        # [package.metadata.deb] em crates/ta-gui/Cargo.toml embala os DOIS
        # binários (name do pacote: curupira-gis; depends=$auto resolve
        # libgdal34/35 via dpkg-shlibdeps). --no-build reusa o build acima.
        run: |
          cargo deb -p ta-gui --no-build
          cp -v target/debian/curupira-gis_*.deb dist/curupira-gis_x64.deb

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-linux-deb
          path: dist/curupira-gis_x64.deb
          if-no-files-found: error

  build-windows:
    name: windows x86_64-msvc (zip com GDAL embutida)
    needs: [verify-version, wait-for-ci]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GUARDA DO B-1: o build tem que sair do commit da TAG — o mesmo SHA
      # que o job `wait-for-ci` validou como CI verde. Se divergir, FALHA
      # (sem publicar nada).
      - name: Confere que o build é do commit da tag
        env:
          EXPECTED_SHA: ${{ needs.wait-for-ci.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::build a partir de ${actual} mas a tag aponta para ${EXPECTED_SHA}"
            exit 1
          fi
          echo "OK: build a partir de ${actual} (tag ${RELEASE_TAG})"

      - name: Instala toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Cache binário do vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-bincache
          key: vcpkg-gdal-x64-windows-v1
          restore-keys: vcpkg-gdal-x64-windows-

      # Mesma correção do ci.yml: o diretório do binary cache precisa
      # existir antes do vcpkg (1ª run falhou aqui em ~14s sem o mkdir).
      - name: Instala GDAL (vcpkg clássico)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install gdal:x64-windows

      - name: Exporta GDAL_LIB_DIR e GDAL_VERSION p/ gdal-sys
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $libDir = Join-Path $vcpkgRoot "installed\x64-windows\lib"
          $binDir = Join-Path $vcpkgRoot "installed\x64-windows\bin"
          if (-not (Test-Path $libDir)) {
            throw "diretório de libs do vcpkg não existe: $libDir — o passo 'vcpkg install gdal:x64-windows' concluiu?"
          }

          # Mesma correção do ci.yml (root cause da run #3): o vcpkg gera o
          # import library como `gdal.lib`, mas o build.rs do gdal-sys 0.12
          # no MSVC procura `gdal_i.lib`. Normalizamos copiando. Idempotente.
          $gdalImport = Join-Path $libDir "gdal_i.lib"
          if (Test-Path $gdalImport) {
            Write-Host "gdal_i.lib já presente em $libDir (idempotente, nada a fazer)"
          } else {
            $candidates = @(Get-ChildItem -Path $libDir -Filter "gdal*.lib")
            $src = $candidates | Where-Object { $_.Name -ieq "gdal.lib" } | Select-Object -First 1
            if (-not $src) { $src = $candidates | Select-Object -First 1 }
            if (-not $src) {
              $allLibs = @(Get-ChildItem -Path $libDir -Filter "*.lib" |
                Select-Object -ExpandProperty Name) -join ", "
              if (-not $allLibs) { $allLibs = "<vazio>" }
              throw "nenhum gdal*.lib em $libDir p/ normalizar em gdal_i.lib — *.lib presentes: [$allLibs]. Verifique o triplet (x64-windows dinâmico) e se o port gdal concluiu a instalação."
            }
            Copy-Item $src.FullName $gdalImport
            Write-Host "Import library normalizada: $($src.Name) -> gdal_i.lib (vcpkg não usa o naming gdal_i do SDK oficial)"
          }

          # Regex relaxada + fallback (ver comentário detalhado no ci.yml):
          # compatível com os formatos antigo e novo de `vcpkg list`; erro
          # imprime o listing.
          $listing = (vcpkg list gdal) -join "`n"
          $gdalVersion = $null
          $m = [regex]::Match($listing, "gdal(\[[^\]]*\])?:x64-windows\s+([0-9]+\.[0-9]+\.[0-9]+)")
          if ($m.Success) { $gdalVersion = $m.Groups[2].Value }
          if (-not $gdalVersion) {
            $linha = ($listing -split "`n" | Where-Object { $_ -match "^\s*gdal" } | Select-Object -First 1)
            if ($linha) {
              $m2 = [regex]::Match($linha, "([0-9]+\.[0-9]+\.[0-9]+)")
              if ($m2.Success) { $gdalVersion = $m2.Groups[1].Value }
            }
          }
          if (-not $gdalVersion) { throw "não consegui extrair a versão do GDAL de 'vcpkg list gdal':`n$listing" }

          "GDAL_LIB_DIR=$libDir"      | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "GDAL_VERSION=$gdalVersion" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          # DLLs de runtime no PATH (simetria com ci.yml): o release não roda
          # testes, mas garante que qualquer binário executado por build
          # scripts não morra com 0xc0000135 STATUS_DLL_NOT_FOUND.
          Add-Content $env:GITHUB_PATH $binDir

      - name: Build release
        run: cargo build --release --workspace

      - name: Empacota zip (exes + DLLs GDAL/PROJ + share)
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT; if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $bin = Join-Path $vcpkgRoot "installed\x64-windows\bin"
          $share = Join-Path $vcpkgRoot "installed\x64-windows\share"
          $name = "curupira-gis-$($env:RELEASE_TAG)-x86_64-pc-windows-msvc"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force -Path "$stage\share" | Out-Null
          Copy-Item target\release\curupira-gis.exe $stage\
          Copy-Item target\release\ta-cli.exe $stage\
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE.md $stage\
          # DLLs de runtime: copiamos o bin dir inteiro do triplet (gdal +
          # dependências transitivas: proj, geos, sqlite, expat, ...). ~100 MB
          # descompactado — aceito no alpha p/ garantir "extrair e rodar".
          Copy-Item "$bin\*.dll" $stage\
          # Dados de projeção/GDAL usados pelo main.rs (PROJ_LIB/GDAL_DATA
          # apontam p/ <exe>\share automaticamente).
          Copy-Item -Recurse "$share\proj" "$stage\share\proj"
          Copy-Item -Recurse "$share\gdal" "$stage\share\gdal"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error

      # --- instalador .exe com Inno Setup (novo; zip acima permanece) ------
      # Run #3 (root cause): `Get-Command ISCC.exe` achou o SHIM do Chocolatey
      # (C:\ProgramData\chocolatey\bin\ISCC.exe) e o dir "Languages" derivado
      # do shim não existe → Get-ChildItem explodiu ("Cannot find path").
      # Correção: resolver o ISCC.exe REAL nesta ordem (1ª que existir vence):
      #   1. %ProgramFiles(x86)%\Inno Setup 6\ISCC.exe
      #   2. %ProgramFiles%\Inno Setup 6\ISCC.exe
      #   3. registry (uninstall keys com DisplayName "Inno Setup*") → InstallLocation
      #   4. tools do pacote choco: C:\ProgramData\chocolatey\lib\innosetup\tools\**\ISCC.exe
      #   5. último recurso: `choco install innosetup` e re-derivar do (4)
      # Run #4 (root cause do ítem 1): pipeline `@(...) | Where-Object` com
      # EXATAMENTE 1 match sofre unroll do PowerShell — `$std` vira STRING e
      # `$std[0]` devolve o 1º CARACTERE ("C") em vez do caminho. ISCC_PATH="C"
      # → `Split-Path "C"` = vazio → `Join-Path` explode ("Cannot bind
      # argument to parameter 'Path'") → exit 1 (log da run: "ISCC real: C").
      # Correção: `Select-Object -First 1` fecha o pipeline e `return $std`
      # (sem indexação) preserva escalar OU array; asserção `Test-Path`
      # antes de exportar GITHUB_ENV converte qualquer regressão futura em
      # erro explícito no lugar certo.
      - name: Localiza ISCC.exe real (Inno Setup 6) — nunca o shim do choco
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-ISCC {
            # Select-Object -First 1 + return sem indexação: o pipeline pode
            # entregar escalar (1 match → unroll) e `$std[0]` numa STRING
            # devolve um caractere — bug da run #4. Ver comentário do step.
            $std = @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if ($std) { return $std }

            $uninstKeys = @(
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            foreach ($root in $uninstKeys) {
              $hit = Get-ItemProperty $root -ErrorAction SilentlyContinue |
                Where-Object { $_.DisplayName -like 'Inno Setup*' -and $_.InstallLocation } |
                ForEach-Object { Join-Path $_.InstallLocation 'ISCC.exe' } |
                Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($hit) { return $hit }
            }

            $tools = 'C:\ProgramData\chocolatey\lib\innosetup\tools'
            $fromTools = {
              if (Test-Path $tools) {
                Get-ChildItem $tools -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
              }
            }
            $hit = & $fromTools
            if ($hit) { return $hit }

            Write-Host "ISCC ausente no runner — instalando via Chocolatey..."
            choco install innosetup -y --no-progress
            $hit = & $fromTools
            if ($hit) { return $hit }
            throw "ISCC.exe não encontrado após 'choco install innosetup' (procurado em Program Files, registry e $tools)"
          }

          $isccPath = Find-ISCC
          # Assegura que veio um caminho REAL (protege o GITHUB_ENV contra
          # qualquer regressão de captura do Find-ISCC — run #4: ISCC_PATH="C").
          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            throw "Find-ISCC retornou caminho inválido: '$isccPath' — esperado ISCC.exe existente."
          }
          Write-Host "ISCC real: $isccPath"
          "ISCC_PATH=$isccPath" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Compila instalador (Inno Setup) → CurupiraGIS-Setup-x64.exe
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT; if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $bin = Join-Path $vcpkgRoot "installed\x64-windows\bin"
          $share = Join-Path $vcpkgRoot "installed\x64-windows\share"
          # Staging consumido por packaging\windows\curupira.iss (mesma
          # composição do zip portátil): exes + *.dll + share\gdal + share\proj
          $stage = "dist\installer-stage"
          New-Item -ItemType Directory -Force -Path "$stage\share" | Out-Null
          Copy-Item target\release\curupira-gis.exe $stage\
          Copy-Item target\release\ta-cli.exe $stage\
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, NOTICE.md $stage\
          Copy-Item "$bin\*.dll" $stage\
          Copy-Item -Recurse "$share\proj" "$stage\share\proj"
          Copy-Item -Recurse "$share\gdal" "$stage\share\gdal"
          # AppVersion do Inno precisa ser numérica pontuada (x.y[.z[.w]]) em
          # qualquer 6.x: "v0.1.0-alpha" → VERSION=0.1.0.
          $version = $env:RELEASE_TAG -replace '^v',''
          $numeric = ($version -split '-')[0]
          # Tradução pt-BR (OPCIONAL — nunca falha o job por idioma): o
          # Languages\ fica no dir do ISCC REAL resolvido no step anterior (o
          # "compiler:" do Inno resolve contra esse dir; o shim do choco da
          # run #3 não tinha Languages\). O nome do .isl varia entre builds do
          # Inno 6 (BrazilianPortuguese.isl / PortugueseBrazil.isl). Sem .isl:
          # compila SEM /DBR_ISL (EN-only) + ::warning::.
          $langsDir = Join-Path (Split-Path $env:ISCC_PATH) "Languages"
          $isccArgs = @("/DVERSION=$numeric")
          if (Test-Path $langsDir) {
            $brIsl = Get-ChildItem $langsDir -Filter *.isl -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -imatch "brazil" } | Select-Object -First 1
            if ($brIsl) {
              $isccArgs += "/DBR_ISL=compiler:Languages\$($brIsl.Name)"
              Write-Host "Tradução pt-BR: $($brIsl.Name)"
            }
          }
          if ($isccArgs.Count -eq 1) {
            Write-Host "::warning::pt-BR ISL não encontrado em $langsDir — instalador EN-only"
          }
          & $env:ISCC_PATH "packaging\windows\curupira.iss" @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou com exit $LASTEXITCODE" }
          $setup = Get-Item dist\CurupiraGIS-Setup-x64.exe
          Write-Host "Instalador gerado: $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-windows-setup
          path: dist/CurupiraGIS-Setup-x64.exe
          if-no-files-found: error

  build-macos:
    name: macos arm64 (CurupiraGIS.app zip, GDAL 3.12 conda-forge)
    needs: [verify-version, wait-for-ci]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GUARDA DO B-1: o build tem que sair do commit da TAG — o mesmo SHA
      # que o job `wait-for-ci` validou como CI verde. Se divergir, FALHA
      # (sem publicar nada).
      - name: Confere que o build é do commit da tag
        env:
          EXPECTED_SHA: ${{ needs.wait-for-ci.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::build a partir de ${actual} mas a tag aponta para ${EXPECTED_SHA}"
            exit 1
          fi
          echo "OK: build a partir de ${actual} (tag ${RELEASE_TAG})"

      - name: Instala toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # DECISÃO GDAL/macOS (revisada 2026-10-17 pós-run #4, @prometheus):
      #   caminho escolhido = GDAL 3.12.x do conda-forge via micromamba,
      #   bindings PRÉ-GERADOS 3_12 (sem bindgen). RISCO NOS DOIS PLANOS
      #   ANTERIORES:
      #   - Run #3 (prebuilt + brew): brew subiu p/ GDAL 3.13 → panic no
      #     build.rs:282 ("No pre-built bindings available for GDAL 3.13").
      #   - Run #4 (bindgen + brew 3.13): os bindings geraram, mas o WRAPPER
      #     safe do gdal 0.19 quebrou contra a API C 3.13 — E0425
      #     `cannot find value GDT_Byte` (types.rs:35 e :342) e E0063
      #     `missing field bOperateInBufType` (rasterband.rs:282). Bindgen
      #     resolve o teto de versão dos bindings, mas NÃO a compatibilidade
      #     do wrapper: a caixa do crate é 3.12.
      #   Consequência: fixar o GDAL em 3.12.x — e como o homebrew-core não
      #   tem fórmula versionada de gdal, a fonte do 3.12 determinístico é o
      #   conda-forge (builds 3.12.* estáveis, pkg-config/gdal-config/dylibs
      #   no mesmo prefixo).
      #   - setup-micromamba PINADO por SHA do objeto da tag v1 (4b9113af…,
      #     API GitHub 2026-10-17).
      #   - create-args pina MINOR (3.12.*): qualquer 3.12.x casa com o
      #     prebuilt-bindings/3_12 do gdal-sys 0.12 (seleção por major.minor,
      #     build.rs:277). Assert abaixo falha rápido em versão inesperada.
      #   - build.rs do gdal-sys 0.12 (lido no registry, seções unix): com
      #     GDAL_HOME setado, link vem de $GDAL_HOME/lib
      #     (rustc-link-search direto, metadata do pkg-config desligada) e o
      #     pkg-config serve SÓ p/ detectar a versão → PKG_CONFIG/PKG_CONFIG_
      #     PATH apontam pro binário/.pc do próprio env (determinístico,
      #     independe do PATH do runner).
      #   - Feature `ta-gis/bindgen-gdal` FICA no Cargo.toml (útil quando o
      #     gdal 0.20 suportar 3.13+) mas NÃO é usada neste job.
      #   - Bundle: packaging/macos/bundle.sh resolve os @rpath do conda
      #     (install names `@rpath/libgdal.38.dylib` confirmados na dylib
      #     3.12.4 osx-arm64 do conda-forge) via $GDAL_HOME/lib e copia
      #     share/proj + share/gdal do prefixo p/ Contents/Resources/share
      #     (dados sob MacOS/ quebram o codesign — tratado como código;
      #     run #5: "code object is not signed at all" em MacOS/share/proj).
      - name: GDAL 3.12 (conda-forge via micromamba; brew abandonado na run #4)
        id: gdalenv
        uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d # v1 (objeto da tag v1)
        with:
          environment-name: gdal
          create-args: >-
            -c conda-forge
            gdal=3.12.*
            pkg-config

      - name: Exporta GDAL_HOME/PKG_CONFIG e assert versão 3.12.x
        run: |
          GDAL_HOME="${{ steps.gdalenv.outputs.environment-path }}"
          [ -n "$GDAL_HOME" ] || { echo "::error::environment-path vazio — env conda não criado?"; exit 1; }
          [ -x "$GDAL_HOME/bin/gdal-config" ] || { echo "::error::gdal-config ausente em $GDAL_HOME — pacote gdal incompleto"; exit 1; }
          [ -f "$GDAL_HOME/lib/pkgconfig/gdal.pc" ] || { echo "::error::gdal.pc ausente em $GDAL_HOME/lib/pkgconfig"; exit 1; }
          {
            echo "GDAL_HOME=$GDAL_HOME"
            echo "PKG_CONFIG_PATH=$GDAL_HOME/lib/pkgconfig"
            echo "PKG_CONFIG=$GDAL_HOME/bin/pkg-config"
          } >> "$GITHUB_ENV"
          v="$("$GDAL_HOME/bin/pkg-config" --modversion gdal)"
          case "$v" in
            3.12.*)
              echo "conda-forge GDAL $v em $GDAL_HOME — prebuilt bindings 3_12 do gdal-sys"
              ;;
            *)
              echo "::error::GDAL inesperado: $v (esperado 3.12.*; pin do conda = gdal=3.12.*)"
              exit 1
              ;;
          esac

      - name: Build release (prebuilt bindings 3_12 — sem bindgen)
        # Restrito a `-p ta-gui -p ta-cli`: os DOIS pacotes que dependem de
        # ta-gis e geram os binários da release (curupira-gis, ta-cli); o
        # resto do workspace é lib e compila como dependência.
        run: cargo build --release -p ta-gui -p ta-cli

      - name: Bundle CurupiraGIS.app + zip (otool walk, @rpath, re-sign ad-hoc)
        # O bundle.sh faz: Contents/{MacOS,Resources,Frameworks} + Info.plist,
        # copia dylibs não-sistema (otool -L recursivo), reescreve p/ @rpath
        # com install_name_tool, RE-ASSINA ad-hoc (obrigatório no arm64 após
        # install_name_tool) e zipa CurupiraGIS-macos-arm64.zip.
        run: |
          v="${RELEASE_TAG#v}"; v="${v%%-*}"
          bash packaging/macos/bundle.sh "$v" target/release dist

      # NOTA (usuário final): zip NÃO assinado — no 1º uso, botão direito no
      # CurupiraGIS.app → "Abrir" para passar pelo Gatekeeper (documentado
      # no README/INSTALL).
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: dist-macos
          path: dist/CurupiraGIS-macos-arm64.zip
          if-no-files-found: error

  sbom:
    name: SBOM CycloneDX (workspace)
    needs: [verify-version, wait-for-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      # GUARDA DO B-1: o SBOM tem que ser do commit da TAG — o mesmo SHA que
      # o job `wait-for-ci` validou como CI verde. Se divergir, FALHA.
      - name: Confere que o build é do commit da tag
        env:
          EXPECTED_SHA: ${{ needs.wait-for-ci.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::build a partir de ${actual} mas a tag aponta para ${EXPECTED_SHA}"
            exit 1
          fi
          echo "OK: build a partir de ${actual} (tag ${RELEASE_TAG})"

      - name: Instala toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Gera SBOM por crate (CycloneDX JSON 1.5)
        # cargo-cyclonedx >=0.5 não tem --output-dir: escreve
        # <crate>-<versão>.cdx.json ao lado do Cargo.toml de cada membro.
        # Coletamos tudo em sbom/ para o artefato.
        run: |
          cargo cyclonedx --format json --spec-version 1.5
          mkdir -p sbom
          find . -name "*.cdx.json" -not -path "./target/*" -exec cp {} sbom/ \;
          ls -la sbom/

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    name: Draft GitHub Release (revisão humana publica)
    needs: [build-linux, build-windows, build-macos, sbom]
    runs-on: ubuntu-latest
    # ÚNICO job com escrita: cria/atualiza a release (GH_TOKEN do workflow).
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums sha256
        run: |
          cd artifacts
          sha256sum *.exe *.deb *.tar.gz *.zip *.cdx.json | tee SHA256SUMS

      - name: Cria (ou atualiza) a release DRAFT com artefatos + checksums + SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NOTES="Draft automático da tag ${RELEASE_TAG}.
          Linux: tar.gz (GDAL do sistema) + .deb | Windows: zip portátil com
          GDAL/PROJ embutidos + instalador CurupiraGIS-Setup-x64.exe |
          macOS arm64: CurupiraGIS-macos-arm64.zip (NÃO assinado — no 1º
          uso, botão direito → Abrir, para passar pelo Gatekeeper).
          Inclui checksums SHA256SUMS e SBOM CycloneDX.
          **Requer revisão humana antes de publicar.**"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run do build de uma tag já existente (workflow_dispatch): a
            # release já existe. Só é seguro ATUALIZAR um DRAFT — se ela já
            # foi PUBLICADA, re-rodar publicaria binário por cima de uma
            # release já distribuída (o `--clobber` sobrescreveria os assets
            # sem aviso). Nesse caso o job FALHA: a correção é criar uma
            # tag nova.
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::a release ${RELEASE_TAG} já está publicada; re-rodar publicaria binário por cima — crie uma tag nova"
              exit 1
            fi
            echo "::notice::release ${RELEASE_TAG} já existe (draft) — atualizando assets e notas"
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Curupira GIS $RELEASE_TAG" \
              --notes "$NOTES" \
              --verify-tag \
              artifacts/*
          fi
